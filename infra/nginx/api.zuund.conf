# api.zuund.com — the NestJS API (pm2 "jhoond-api" cluster on 127.0.0.1:4300).
# Routes live under /api/… (Nest global prefix), e.g. https://api.zuund.com/api/health.

server {
    listen 80;
    listen [::]:80;
    server_name api.zuund.com;

    access_log /var/log/nginx/api.zuund.access.log;
    error_log  /var/log/nginx/api.zuund.error.log;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
