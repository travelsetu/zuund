# api.zuund.com — the NestJS API (pm2 "zuund-api" cluster on 127.0.0.1:4300).
# Routes live under /api/… (Nest global prefix), e.g. https://api.zuund.com/api/health.
#
# Installed by infra/deploy.sh once the certificate exists; certbot only
# manages the certificate files, never this file.

server {
    listen 80;
    listen [::]:80;
    server_name api.zuund.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.zuund.com;

    ssl_certificate     /etc/letsencrypt/live/api.zuund.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zuund.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/api.zuund.access.log;
    error_log  /var/log/nginx/api.zuund.error.log;

    # Uploads go through the API (UPLOAD_MAX_BYTES caps them at 10 MB); headroom for the multipart envelope.
    client_max_body_size 32m;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
