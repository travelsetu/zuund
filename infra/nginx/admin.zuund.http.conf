# admin.zuund.com — the Vite-built admin dashboard, served as files.
# BOOTSTRAP VARIANT (plain HTTP). infra/deploy.sh installs this only while a
# hostname has no certificate yet: it serves the ACME challenge so certbot can
# issue one, after which the .conf sibling (with TLS) replaces it.
#
# No process to restart: a deploy writes each build to
# /srv/zuund-admin/releases/<sha> and points `current` at it. Replacing a
# symlink is atomic, so a request gets all of the old release or all of the
# new one, never a directory mid-rewrite. Rollback is the same move backwards.

server {
    listen 80;
    listen [::]:80;
    server_name admin.zuund.com;

    access_log /var/log/nginx/admin.zuund.access.log;
    error_log  /var/log/nginx/admin.zuund.error.log;

    root /srv/zuund-admin/current;
    index index.html;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Hashed filenames: a changed file is a changed URL, so cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html is the same URL every release and points at the new hashes,
    # so it must never be cached.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Single-page app: any path without a file behind it is a client route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
