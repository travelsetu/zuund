# zuund.com — the public Next.js site (pm2 "zuund-web" on 127.0.0.1:3300).
#
# Copied verbatim into /etc/nginx/sites-available by infra/deploy.sh once
# certificates for zuund.com and www.zuund.com exist, so edit it here, not on
# the server. certbot only issues and renews the certificate files referenced
# below; it never rewrites this file, so a deploy never has a moment without
# a TLS server block (that moment is a failed handshake for every visitor).

server {
    listen 80;
    listen [::]:80;
    server_name zuund.com www.zuund.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    # Inside a location, not at server level: a server-level `return` runs
    # before location matching and would swallow the ACME challenge above.
    location / { return 301 https://zuund.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zuund.com;

    ssl_certificate     /etc/letsencrypt/live/www.zuund.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zuund.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://zuund.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zuund.com;

    ssl_certificate     /etc/letsencrypt/live/zuund.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zuund.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/zuund.access.log;
    error_log  /var/log/nginx/zuund.error.log;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
