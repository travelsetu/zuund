# zuund.com — the public Next.js site (pm2 "jhoond-web" on 127.0.0.1:3300).
#
# Copied into /etc/nginx/sites-available by infra/deploy.sh on every deploy, so
# edit it here, not on the server. This file is plain HTTP: certbot owns the
# TLS lines and re-adds them after each copy (see deploy.sh).

server {
    listen 80;
    listen [::]:80;
    server_name www.zuund.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    # Inside a location, not at server level: a server-level `return` runs
    # before location matching and would swallow the ACME challenge above.
    location / { return 301 $scheme://zuund.com$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name zuund.com;

    access_log /var/log/nginx/zuund.access.log;
    error_log  /var/log/nginx/zuund.error.log;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
