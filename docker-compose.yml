services:
  postgres:
    image: postgres:16-alpine
    container_name: zuund-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zuund}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zuund}
      POSTGRES_DB: ${POSTGRES_DB:-zuund}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - zuund_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-zuund} -d ${POSTGRES_DB:-zuund}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zuund_pgdata:
